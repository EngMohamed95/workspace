# Checks pull requests: clean install, type check and production build.
# Pushes to main are built and deployed by deploy-ftp.yml, which runs the same checks.

name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check build output
        run: test -f dist/server.js && test -f dist/index.html
