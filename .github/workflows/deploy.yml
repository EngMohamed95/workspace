# Deploys Stack Space to workspace.devmo.pro over FTP on every push to main
# (or manually: Actions → Deploy to Hostinger (FTP) → Run workflow).
#
# How it runs on the server: the FTP account only reaches public_html, while hPanel's
# Node.js app lives outside it. So the app is uploaded to public_html/stackspace/ and
# public_html/.htaccess (uploaded too) tells Hostinger's Node.js runner to start
# stackspace/server.js. hPanel's environment variables do not reach this copy, so the
# workflow writes stackspace/.env from the secrets below; stackspace/ is closed to visitors.
#
# Note: a "Redeploy" in hPanel rewrites public_html/.htaccess back to hPanel's own app.
# Push again (or re-run this workflow) to switch back.
#
# Repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD   the FTP account (its folder is public_html)
#   MYSQL_PASSWORD                           password of the MySQL user below
#   ADMIN_PASSCODE                           optional: password for the 'admin' account

name: Deploy to Hostinger (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

env:
  SITE_DOMAIN: workspace.devmo.pro
  # Absolute path of the FTP account's folder (hPanel → Files → FTP Accounts).
  PUBLIC_HTML: /home/u549743922/domains/workspace.devmo.pro/public_html
  APP_DIR: stackspace
  MYSQL_HOST: localhost
  MYSQL_PORT: "3306"
  MYSQL_USER: u549743922_worksapce
  MYSQL_DATABASE: u549743922_worksapce

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build && test -f dist/server.js && test -f dist/index.html

      - name: Check secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          missing=""
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD DB_PASSWORD; do
            [ -z "${!name}" ] && missing="$missing ${name/DB_PASSWORD/MYSQL_PASSWORD}"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi
          case "$DB_PASSWORD" in
            *"'"*|*$'\n'*) echo "::error::MYSQL_PASSWORD must not contain a single quote or a line break. Pick another database password."; exit 1 ;;
          esac

      - name: Prepare upload folder
        env:
          DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          ADMIN_PASSCODE: ${{ secrets.ADMIN_PASSCODE }}
        run: |
          app="deploy/$APP_DIR"
          mkdir -p "$app/tmp"
          cp -r dist package.json server.js "$app/"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$app/tmp/restart.txt"
          echo "$GITHUB_SHA" > "$app/dist/version.txt"

          # Runtime settings for the app (read by server.js). Single quotes keep the
          # password literal; the previous step rejects passwords containing one.
          {
            echo "MYSQL_HOST='$MYSQL_HOST'"
            echo "MYSQL_PORT='$MYSQL_PORT'"
            echo "MYSQL_USER='$MYSQL_USER'"
            echo "MYSQL_PASSWORD='$DB_PASSWORD'"
            echo "MYSQL_DATABASE='$MYSQL_DATABASE'"
            if [ -n "$ADMIN_PASSCODE" ]; then echo "ADMIN_PASSCODE='$ADMIN_PASSCODE'"; fi
          } > "$app/.env"

          # Nothing in the app folder is served to visitors (code, .env, logs).
          printf 'Require all denied\n' > "$app/.htaccess"

          # Route the site to the Node.js app in public_html/stackspace.
          root="$PUBLIC_HTML/$APP_DIR"
          cat > deploy/.htaccess <<EOF
          PassengerAppRoot $root
          PassengerAppType node
          PassengerNodejs /opt/alt/alt-nodejs22/root/bin/node
          PassengerStartupFile server.js
          PassengerBaseURI /
          PassengerRestartDir $root/tmp
          SetEnv LSNODE_CONSOLE_LOG console.log

          <Files ".ftp-deploy-sync-state.json">
            Require all denied
          </Files>
          EOF

          echo "--- deploy/.htaccess"; cat deploy/.htaccess
          echo "--- files"; find deploy -type f ! -name .env | sort

      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ./
          log-level: standard

      - name: Check the live site
        run: |
          for i in $(seq 1 30); do
            body=$(curl -s -m 20 "https://$SITE_DOMAIN/api/auth/status" || true)
            case "$body" in
              *needsSetup*) echo "Live: $body"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::https://$SITE_DOMAIN/api/auth/status did not answer after the upload. Open public_html/$APP_DIR/console.log in hPanel's file manager for the app's error."
          exit 1
