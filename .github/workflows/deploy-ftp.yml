# Builds Stack Space on GitHub and uploads it to the Hostinger Node.js app over FTP
# on every push to main (or manually from the Actions tab).
#
# One-time setup in GitHub → Settings → Secrets and variables → Actions → Secrets:
#   FTP_SERVER      FTP host from hPanel → Files → FTP Accounts
#   FTP_USERNAME    FTP user (must be able to reach the Node.js app folder, not only public_html)
#   FTP_PASSWORD    FTP password
#   FTP_SERVER_DIR  the Node.js app root (the PassengerAppRoot folder in public_html/.htaccess),
#                   written relative to the FTP account's home and ending with "/".
#                   Required: uploading to public_html does NOT update a Node.js app.
#
# What gets uploaded: dist/ (client build + self-contained dist/server.js), package.json and
# tmp/restart.txt (a changed restart.txt makes the app restart with the new code).
# Only changed files are uploaded; the action keeps .ftp-deploy-sync-state.json on the server.

name: Build & deploy (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check build output
        run: test -f dist/server.js && test -f dist/index.html

      - name: Prepare upload folder
        run: |
          mkdir -p deploy/tmp
          cp -r dist package.json deploy/
          date -u +%Y-%m-%dT%H:%M:%SZ > deploy/tmp/restart.txt
          echo "${GITHUB_SHA}" > deploy/dist/version.txt
          ls -la deploy deploy/dist

      - name: Check FTP settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=""
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. FTP_SERVER_DIR must be the Node.js app root (see PassengerAppRoot in public_html/.htaccess)."
            exit 1
          fi
          case "$FTP_SERVER_DIR" in
            */) ;;
            *) echo "::error::FTP_SERVER_DIR must end with '/'."; exit 1 ;;
          esac
          case "$FTP_SERVER_DIR" in
            *public_html*) echo "::error::FTP_SERVER_DIR points at public_html; a Node.js app does not run from there. Use the app root."; exit 1 ;;
          esac

      - name: Upload to server (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          log-level: standard
