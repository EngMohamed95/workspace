# Builds Stack Space and uploads it to the Hostinger server over FTP on every push to main.
#
# One-time setup in GitHub → Settings → Secrets and variables → Actions → Secrets:
#   FTP_SERVER      e.g. ftp.workspace.devmo.pro
#   FTP_USERNAME    e.g. u549743922.workspace
#   FTP_PASSWORD    the FTP account password
#   FTP_SERVER_DIR  (optional) remote folder, relative to the FTP account's home; default ./
#
# What gets uploaded: dist/ (client build + self-contained dist/server.js) and package.json.
# The server needs no node_modules: all dependencies are bundled into dist/server.js.
# Only changed files are uploaded (the action keeps .ftp-deploy-sync-state.json on the server).

name: Build & deploy (FTP)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Prepare upload folder
        run: |
          mkdir -p deploy/tmp
          cp -r dist package.json deploy/
          # Passenger/LiteSpeed-style restart trigger: a changed tmp/restart.txt restarts the app.
          date -u +%Y-%m-%dT%H:%M:%SZ > deploy/tmp/restart.txt
          echo "${GITHUB_SHA}" > deploy/dist/version.txt
          ls -la deploy deploy/dist

      - name: Check FTP settings
        id: config
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::FTP_SERVER / FTP_USERNAME / FTP_PASSWORD secrets are not all set; skipping upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to server (FTP)
        if: steps.config.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          log-level: standard
